version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    # Ungrouped, this ecosystem opened one branch + PR per action, each triggering its own CI run.
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # Added 2026-09-03 (packaging audit 03/F09): without it the third-party revs pinned in
  # .pre-commit-config.yaml -- detect-secrets, actionlint-py, shellcheck-py, codespell and
  # mirrors-mypy -- were the only pinned third-party versions in the repo no bot ever looked at,
  # while the SHA-pinned actions above got weekly bumps. Two of the five gate CI-equivalent
  # checks (codespell mirrors ci.yml's codespell-paths; mirrors-mypy must stay equal to
  # pyproject.toml's `mypy==2.3.1` pin), which is exactly the pre-commit-vs-CI drift class the
  # ruff pin's comment in pyproject.toml documents. Grouped like github-actions above so the
  # whole ecosystem costs one PR (and one CI run) per week rather than one per hook, which is
  # what keeps it inside the Actions-minutes budget that disabled `pip` below.
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      pre-commit:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # Temporarily disabled 2026-07-10 (open-pull-requests-limit: 0): every PR/branch this
  # ecosystem opens triggers the repo's own CI matrix (ci.yml/Black/MyPy) on push, which was
  # contributing to the account's Actions-minutes exhaustion (see mlframe's ci.yml matrix
  # comment for the full accounting -- mlframe's Windows/macOS legs were the dominant cost,
  # but every repo on the account shares the same monthly quota). github-actions above stays
  # active since it's the priority ecosystem and opens far fewer PRs. Raise back to 1-3 once
  # the Actions-minutes budget allows.
  #
  # The disable is bounded, not open-ended (2026-09-03 security audit F10): with VERSION updates
  # off and no lockfile, nothing in the repo recorded exposure to a published advisory in
  # requests/selenium/boto3/..., so a CVE would surface only if a maintainer read advisories by
  # hand. .github/workflows/pip-audit.yml now runs `pip-audit` weekly on ONE ubuntu-latest runner
  # and fails on an advisory -- the security signal, at a fraction of the minutes a PR-per-bump
  # ecosystem costs. Dependabot SECURITY updates (repo Settings -> Code security), which fire only
  # on advisories rather than on routine bumps, are the complementary lever and can be enabled
  # without lifting the limit below.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: deps
    # Group minor/patch bumps into a single PR to reduce noise.
    groups:
      python-dependencies:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
