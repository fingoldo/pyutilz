name: pydoclint

# Docstring-vs-signature consistency (params, returns, raises, yields) over src/pyutilz. The configuration lives in [tool.pydoclint] of
# pyproject.toml, and the same invocation runs locally.
#
# Blocking: pydoclint reports every docstring-versus-signature mismatch in src/pyutilz, and the count is zero.

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pydoclint:
    name: pydoclint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pydoclint
        run: python -m pip install "pydoclint==0.9.1"

      - name: Check docstrings against signatures
        run: pydoclint --style=google src/pyutilz
