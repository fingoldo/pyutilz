name: Black

on:
  push:
    branches: [main, master]
    # Push only, as in ci.yml: a docs/audit-only commit changes no Python for Black to check.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "audits/**"
      - "LICENSE"
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Extracted to fingoldo/py-ci-shared (2026-07-09): identical logic to mlframe's own Black
# workflow, script now lives in the shared py_ci_shared package instead of scripts/ here.
jobs:
  black:
    uses: fingoldo/py-ci-shared/.github/workflows/black-filtered.yml@d6e76b74b2c171ad79e4afcf3263113d0843af78  # v1.23.12  # pragma: allowlist secret
    with:
      py-ci-shared-ref: 6cde3dc7ea7d8b36fb8273a5acb9dc96cf70caa5  # v1.23.12  # pragma: allowlist secret
      check-path: "."
