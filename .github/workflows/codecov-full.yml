name: codecov-full

# ci.yml's "codecov" badge and numba-coverage.yml's "codecov-numba" badge measure overlapping,
# not disjoint, slices of the same codebase (ci.yml runs the whole suite under normal JIT, where
# every @njit body is invisible to coverage.py; numba-coverage.yml re-runs a NARROWER subset --
# test_numbalib.py/test_similarity.py/stats/test_normality.py/performance/kernel_tuning/ -- under
# NUMBA_DISABLE_JIT=1 specifically to see inside those bodies). Their percentages cannot be added
# together to get a combined figure. This job downloads both jobs' raw `.coverage` data, merges
# them with `coverage combine` (a line counts as covered if EITHER run executed it), and uploads
# the result to Codecov under its own `combined` flag -- the `codecov-full` badge. Mirrors
# mlframe's identical codecov-full.yml.
#
# Auto-fires on completion of numba-coverage-nightly (chaining CI -> numba-coverage-nightly ->
# this job). This job carries CODECOV_TOKEN, so the workflow_run trigger is gated (job-level
# `if:`, not just the `on:` filter) on conclusion == 'success' AND event in ('push',
# 'workflow_run') -- github.event.workflow_run.event here reflects what triggered
# numba-coverage-nightly ITSELF, which is 'workflow_run' when IT was chain-triggered off CI (the
# common case) and 'push' only on its schedule/dispatch fallback legs (which don't set this field
# at all, hence the event_name != 'workflow_run' escape hatch above). numba-coverage-nightly's
# OWN trigger already carries the identical event=='push' mitigation one level up (see that
# file), so by the time IT completes and fires this job, the chain has already been vetted back
# to a real push -- allowing 'workflow_run' here doesn't reopen the fork-PR hole, it just trusts
# the already-verified upstream link instead of re-deriving it (which the 'event' field can't do
# past one hop anyway). Neither value can be forged by an external fork PR (GitHub sets this
# field server-side from what actually triggered the upstream workflow). Mirrors the identical
# mitigation class on numba-coverage.yml's own workflow_run trigger (see that file + zizmor.yml's
# dangerous-triggers ignore comment for the fuller writeup). The daily cron stays as a fallback.
#
# Falls back to the latest successful ci.yml run on master for the OTHER side's data, which need
# not be the exact same commit as the nightly's -- acceptable drift for a coverage trend badge,
# not a per-commit gate.

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_run:
    workflows: ["numba-coverage-nightly"]
    branches: [master]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  merge-and-upload:
    name: Merge ci.yml + numba-coverage.yml raw coverage, upload combined flag
    runs-on: ubuntu-latest
    # workflow_run fires on EVERY completion of numba-coverage-nightly regardless of outcome --
    # only chain off a genuinely green run that itself came from an already-vetted trigger
    # (see the on: block comment above for why 'workflow_run' is accepted here, not just 'push').
    if: |
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["push", "workflow_run"]'), github.event.workflow_run.event))
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install coverage
        run: pip install "coverage[toml]>=7.0"

      - name: Find the latest completed numba-coverage-nightly run with real data
        id: find_numba_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The single most-recent "completed" run (any conclusion) can be one that got
          # cancelled before its upload step ran -- still "completed", but no raw-coverage-numba
          # artifact (mirrors mlframe's identical codecov-full.yml fix, confirmed live there:
          # run 32923232739 picked exactly such a cancelled run and failed with "No raw coverage
          # data downloaded"). Walk back through the last 10 completed runs and pick the first
          # that actually has the artifact, instead of trusting "latest" blindly.
          # `.expired == false`: GitHub keeps an expired artifact LISTED in the API long after
          # its bytes are gone, so a run can pass this existence check and then fail the download
          # with "Artifact has expired" (2026-09-20 run 35514581159). Only a downloadable artifact
          # counts as real data.
          run_id=""
          for candidate in $(gh run list --repo "${{ github.repository }}" --workflow numba-coverage.yml \
              --status completed --limit 10 --json databaseId --jq '.[].databaseId'); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/$candidate/artifacts" \
              --jq '[.artifacts[] | select(.name == "raw-coverage-numba" and .expired == false)] | length')
            if [ "$count" -gt 0 ]; then
              run_id="$candidate"
              echo "Using run $run_id"
              break
            fi
            echo "Skipping run $candidate (no raw-coverage-numba artifact)"
          done
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [ -z "$run_id" ]; then
            echo "No completed numba-coverage-nightly run with real data found in the last 10 runs."
          fi

      - name: Download numba-coverage-nightly's raw data
        if: steps.find_numba_run.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: raw-coverage-numba
          path: raw-coverage/numba
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find_numba_run.outputs.run_id }}
          repository: ${{ github.repository }}

      - name: Find the latest completed ci.yml run on master with real data
        id: find_ci_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --status completed (any conclusion), not --status success: the raw-coverage-ci
          # artifact only exists if the 3.11 leg's own "Upload raw coverage data" step ran
          # (success-or-failure), so a run where some OTHER version's leg failed still
          # contributes real, valid data. But the single most-recent completed run can be one
          # that got CANCELLED before that step ran at all -- still "completed", zero artifacts
          # (mirrors mlframe's identical codecov-full.yml fix, confirmed live there). Walk back
          # through the last 10 completed runs and pick the first with a real artifact.
          run_id=""
          for candidate in $(gh run list --repo "${{ github.repository }}" --workflow ci.yml --branch master \
              --status completed --limit 10 --json databaseId --jq '.[].databaseId'); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/$candidate/artifacts" \
              --jq '[.artifacts[] | select(.name == "raw-coverage-ci" and .expired == false)] | length')
            if [ "$count" -gt 0 ]; then
              run_id="$candidate"
              echo "Using run $run_id"
              break
            fi
            echo "Skipping run $candidate (no raw-coverage-ci artifact)"
          done
          if [ -z "$run_id" ]; then
            echo "No completed ci.yml run with real data found in the last 10 runs -- skipping the combined upload this time."
            echo "run_id=" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          fi

      - name: Download ci.yml's raw data
        if: steps.find_ci_run.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: raw-coverage-ci
          path: raw-coverage/ci
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find_ci_run.outputs.run_id }}
          repository: ${{ github.repository }}

      - name: Combine and render the merged report
        run: |
          find raw-coverage -name '.coverage' | sort
          mkdir -p combined_input
          i=0
          while IFS= read -r -d '' f; do
            i=$((i + 1))
            cp "$f" "combined_input/.coverage.shard$i"
          done < <(find raw-coverage -name '.coverage' -print0)
          if [ "$i" -eq 0 ]; then
            echo "No raw coverage data downloaded from either workflow -- nothing to combine."
            exit 1
          fi
          echo "Combining $i data file(s)"
          # This report is the `codecov-full` trend badge, not a per-commit gate (see the header).
          # `coverage report` applies pyproject's whole-suite fail_under all the same and exits 2,
          # which failed this job even after the download was fixed (run 35566326508: merged 7.22%,
          # one side only). Render through the same config with the floor dropped, derived from
          # pyproject rather than restated here where the two would drift apart.
          python - <<'PYEOF'
          import pathlib
          import tomllib

          NL = chr(10)
          cfg = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["tool"]["coverage"]
          cfg.get("report", {}).pop("fail_under", None)
          out = []
          for section, body in cfg.items():
              out.append("[" + section + "]")
              for key, value in body.items():
                  if isinstance(value, list):
                      out.append(key + " =" + NL + "    " + (NL + "    ").join(str(v) for v in value))
                  elif isinstance(value, bool):
                      out.append(key + " = " + str(value).lower())
                  else:
                      out.append(key + " = " + str(value))
              out.append("")
          pathlib.Path(".coveragerc-merged").write_text(NL.join(out), encoding="utf-8")
          PYEOF
          coverage combine combined_input
          coverage xml --rcfile=.coveragerc-merged -o coverage-full.xml
          coverage report --rcfile=.coveragerc-merged

      - name: Upload combined coverage to Codecov
        uses: fingoldo/py-ci-shared/.github/actions/upload-codecov@6a8e3829678dab35e21d380292f7b34ae84c8d14  # v1.17.0  # pragma: allowlist secret
        with:
          files: ./coverage-full.xml
          flags: combined
          token: ${{ secrets.CODECOV_TOKEN }}
