name: Dependency review

# Blocks a PR that introduces a known-vulnerable or license-incompatible dependency, before
# merge -- complementary to lint-advisory.yml's pip-audit (post-merge, advisory-only) and
# Dependabot (proposes upgrades, doesn't gate incoming PRs). Added 2026-07-18 CI/CD architecture
# review: near-zero cost, standard GitHub-native control this repo didn't have yet.

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec  # v5.0.1
        with:
          fail-on-severity: high
