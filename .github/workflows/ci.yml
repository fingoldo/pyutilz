name: CI

on:
  push:
    branches: [main, master]
    # A docs/audit-only push would otherwise spend the whole test matrix, mypy and black. Push only:
    # "CI required checks" is a required status on PRs, and a required check that never runs leaves the
    # PR pending forever instead of skipped. Mirrors mlframe's ci.yml.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "audits/**"
      - "LICENSE"
  pull_request:
    branches: [main, master]
  schedule:
    # Sunday 03:17 UTC: the weekly full OS x Python sweep. Off the hour because scheduled runs queue
    # account-wide and most crons sit on :00.
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run the full three-OS, all-version sweep instead of the representative push legs"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are worth cancelling; a push to master is not. The 21-leg matrix takes
  # longer than the gap between pushes on a busy day, so cancelling meant master's own result was
  # never established -- three consecutive runs died at 10-20 of 21 legs with zero failures and
  # nothing to show for the minutes spent.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The matrix is chosen by EVENT, as in mlframe's ci.yml. A push runs five representative legs: ubuntu on
  # the floor (3.8), the coverage leg (3.11) and the ceiling (3.14), plus windows and macOS on 3.11 so both
  # non-linux branches of the platform-specific code (wmi/pywin32, cp1251 console, POSIX permission bits)
  # still run on every commit. A pull_request, the weekly schedule and a workflow_dispatch with
  # full_matrix=true run the full 21-leg sweep. The full sweep on every push cost ~150 runner-minutes
  # (macOS billed 10x, windows 2x) and queued behind the ~20-concurrent-job account budget.
  matrix-setup:
    name: Choose the matrix for this event
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build the job list
        id: build
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_FULL: ${{ inputs.full_matrix }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          full = os.environ["EVENT_NAME"] in ("pull_request", "schedule") or os.environ.get("FORCE_FULL") == "true"
          versions = ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
          if full:
              legs = [{"os": "ubuntu-latest", "python-version": v} for v in versions]
              legs += [{"os": "windows-latest", "python-version": v} for v in versions]
              # macos-latest is arm64 and setup-python publishes no 3.8/3.9 build for it, so the floor
              # runs on the Intel image instead of being dropped.
              legs += [{"os": "macos-15-intel" if v in ("3.8", "3.9") else "macos-latest", "python-version": v} for v in versions]
          else:
              legs = [{"os": "ubuntu-latest", "python-version": v} for v in ("3.8", "3.11", "3.14")]
              legs += [{"os": "windows-latest", "python-version": "3.11"}, {"os": "macos-latest", "python-version": "3.11"}]
          print("matrix=" + json.dumps({"include": legs}))
          PY

  test:
    needs: matrix-setup
    runs-on: ${{ matrix.os }}
    # bash on every OS (it ships on the Windows runners too): the run: blocks below are
    # written in POSIX shell, and Windows would otherwise default to pwsh and parse them differently.
    defaults:
      run:
        shell: bash
    # Windows and macOS legs run appreciably slower than ubuntu on the same suite.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Three OSes since 2026-09-02: this library carries genuinely platform-specific code
      # (wmi/pywin32 probes, a cp1251 console path, POSIX permission bits, path handling),
      # and a linux-only matrix could never exercise either non-linux half of those branches.
      matrix: ${{ fromJSON(needs.matrix-setup.outputs.matrix) }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
        # test_no_stale_todos dates each TODO with git blame; a shallow clone dates every line to the boundary,
        # so py-ci-shared's stale_comment_age refuses it rather than pass having checked nothing. Full history
        # only on the ubuntu 3.11 leg, which always runs; the test skips explicitly on a shallow clone elsewhere.
        fetch-depth: ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11') && '0' || '1' }}

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    # uv resolves and installs the heavy extras union several times faster than pip. The cache key covers
    # requirements-dev.txt too: it carries the py-ci-shared pin every leg installs.
    - name: Set up uv
      uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      with:
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          requirements-dev.txt

    - name: Install dependencies
      # Single unconditional install for every matrix leg. The two Python-floor incompatibilities
      # that used to force a per-leg hand-edited install command are now expressed as environment
      # markers in pyproject.toml itself (`spacy ; python_version >= '3.10'` for [nlp]'s
      # thinc>=8.3.12 floor, `google-genai ; python_version >= '3.9'` for [llm]), so pip resolves
      # each leg correctly from metadata rather than from a hand-transcribed package list here
      # that silently drifts whenever those groups change (2026-09-02 packaging audit).
      env:
        UV_SYSTEM_PYTHON: "1"
      run: |
        uv pip install -e ".[pandas,polars,database,system,llm,nlp,cloud,speedups,dev]"
        # The meta-suite imports py_ci_shared directly (value_bearing_asserts, deferred_drift,
        # gate_integrity, ...). It is deliberately NOT in [dev] - a git+https requirement in project
        # metadata makes the distribution unpublishable - so it is installed from the declared
        # requirement in requirements-dev.txt, which carries the one SHA pin; installing it inline here
        # let CI and the declared dependency name different commits.
        # py-ci-shared requires python>=3.9: the requirement's marker skips it on the 3.8 legs, where
        # conftest ignores the meta-tests that import it; on every other leg a missing install fails.
        uv pip install -r requirements-dev.txt

    - name: Download nltk punkt_tab data
      # [nlp] installs the nltk PACKAGE but not its corpora -- those are a separate runtime
      # download, never bundled by pip. tests/test_tokenizers_extra.py's
      # AdvancedTokenizer.tokenize() calls nltk.sent_tokenize(), which needs punkt_tab on disk.
      # Runs on every leg now that [nlp] itself installs everywhere (only spacy is
      # marker-gated to >=3.10); nltk has no such floor.
      run: python -c "import nltk; nltk.download('punkt_tab')"

    - name: Download the spaCy model AdvancedTokenizer loads
      # spaCy ships no models with the package -- pyutilz.text.tokenizers.AdvancedTokenizer loads
      # en_core_web_sm in __init__, and its tests skip without it. `|| true` because [nlp] gates
      # spacy behind python_version >= '3.10', so the 3.8/3.9 legs have no spacy to download into.
      run: python -m spacy download en_core_web_sm || true

    - name: Run tests with coverage
      env:
        # Lets test_no_stale_todos skip on the shallow legs (see fetch-depth above); unset on the full-history leg.
        PYUTILZ_CI_SHALLOW_CLONE: ${{ (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11') && '0' || '1' }}
      run: |
        pytest -m "not gpu" -n auto --dist=loadgroup --cov=src/pyutilz --cov-report=xml --cov-report=term-missing --cov-fail-under=85 --durations=200

    - name: Upload coverage to Codecov
      uses: fingoldo/py-ci-shared/.github/actions/upload-codecov@6a8e3829678dab35e21d380292f7b34ae84c8d14  # v1.17.0  # pragma: allowlist secret
      if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
      with:
        files: ./coverage.xml
        # Explicit flag so the per-push series is distinguishable from numba-disabled and combined.
        flags: unit
        token: ${{ secrets.CODECOV_TOKEN }}

    # Raw sqlite `.coverage` (not the derived coverage.xml above) so codecov-full.yml can
    # `coverage combine` this run's data with numba-coverage-nightly's into one genuinely unioned
    # line-coverage report -- summing the two flags' already-published percentages double-counts
    # every line both jobs happen to exercise, which is most of the codebase (mirrors mlframe's
    # identical codecov-full.yml). `.coverage` is a dotfile -- upload-artifact needs
    # include-hidden-files to pick it up. Only the 3.11 leg (same one Codecov itself gets, and the
    # only version numba-coverage.yml runs) contributes; a different version's coverage.py
    # database format/line-numbering context isn't guaranteed compatible for `coverage combine`.
    - name: Upload raw coverage data (for the cross-workflow merged report)
      if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest' && (success() || failure())
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: raw-coverage-ci
        path: .coverage
        retention-days: 3
        include-hidden-files: true
        if-no-files-found: ignore

  # Blocking gate + two lint bundles, all extracted to fingoldo/py-ci-shared reusable workflows
  # (2026-07-09) since their logic is identical across mlframe/pyutilz -- see
  # https://github.com/fingoldo/py-ci-shared and this repo's pyproject.toml `[tool.ruff] extend`.
  ruff-blocking:
    name: Ruff (real bugs - blocking)
    uses: fingoldo/py-ci-shared/.github/workflows/ruff-blocking.yml@6a8e3829678dab35e21d380292f7b34ae84c8d14  # v1.17.0  # pragma: allowlist secret
    with:
      py-ci-shared-ref: 6a8e3829678dab35e21d380292f7b34ae84c8d14  # v1.17.0  # pragma: allowlist secret
      ignore: "C901"

  lint-blocking:
    name: lint + security (blocking, triaged clean)
    uses: fingoldo/py-ci-shared/.github/workflows/lint-blocking.yml@6a8e3829678dab35e21d380292f7b34ae84c8d14  # v1.17.0  # pragma: allowlist secret
    with:
      source-path: src/pyutilz
      codespell-paths: src docs README.md CHANGELOG.md CONTRIBUTING.md TESTING.md
      vulture-whitelist-path: scripts/vulture_whitelist.py
      interrogate-source-path: src/pyutilz
      interrogate-fail-under: 100
      deptry-install-command: pip install -e ".[all,dev]"
      run-zizmor: true

  lint-advisory:
    name: lint (advisory)
    uses: fingoldo/py-ci-shared/.github/workflows/lint-advisory.yml@6a8e3829678dab35e21d380292f7b34ae84c8d14  # v1.17.0  # pragma: allowlist secret
    with:
      py-ci-shared-ref: 6a8e3829678dab35e21d380292f7b34ae84c8d14  # v1.17.0  # pragma: allowlist secret
      source-path: src/pyutilz

  build:
    # Packaging sanity check on every push/PR, not just at release-tag time (publish.yml
    # already builds+twine-checks on tag push, but that's too late to catch a packaging bug --
    # by then it's the actual release). Mirrors mlframe's ci.yml build-verification job.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Build distributions
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Verify distributions with twine
      run: |
        pip install twine
        twine check dist/*

    - name: Verify sdist ships tests + changelog
      # MANIFEST.in is the only thing putting these in the tarball, and a MANIFEST typo fails
      # silently (setuptools just omits the files). Found 2026-09-02: the sdist contained neither,
      # so downstream redistributors could not run the suite against their own build.
      run: |
        python - <<'PY'
        import glob, sys, tarfile
        sdist = glob.glob("dist/*.tar.gz")[0]
        names = tarfile.open(sdist).getnames()
        missing = [w for w in ("/tests/", "/CHANGELOG.md") if not any(w in n for n in names)]
        if missing:
            sys.exit(f"sdist {sdist} is missing {missing} -- check MANIFEST.in")
        print(f"sdist OK: {len(names)} entries, tests/ and CHANGELOG.md present")
        PY

    - name: Install wheel + smoke import
      run: |
        pip install dist/*.whl
        python -c "import pyutilz; print('pyutilz', pyutilz.__version__)"

  # Single aggregation point for branch-protection required status checks: the actual gating
  # jobs above are a python-version matrix (currently 7 versions) plus several reusable-workflow
  # calls, so their individual check names churn whenever the matrix is resized -- listing them
  # all as required checks would go stale silently. This job's own fixed name is the one required
  # check; `if: always()` lets it run even after an upstream failure so it can report that failure
  # itself rather than being skipped (a skipped required check blocks merge same as a failed one,
  # but with no clear reason in the PR UI). lint-advisory is intentionally excluded -- it's
  # advisory by design (see lint-advisory.yml), never a merge gate. Mirrors mlframe's ci.yml.
  ci-required:
    name: CI required checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, ruff-blocking, lint-blocking, build]
    steps:
      - name: Check all required jobs succeeded
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          ANY_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "$NEEDS_JSON"
          if [[ "$ANY_FAILED" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
