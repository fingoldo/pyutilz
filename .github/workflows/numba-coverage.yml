name: numba-coverage-nightly

# @njit-compiled kernel bodies are invisible to coverage.py under normal JIT execution (the
# machine code coverage.py's settrace hooks see is not the traced Python bytecode) -- see
# CLAUDE.md memory reference_numba_coverage_blind. This nightly job reruns the test suites that
# exercise numba kernels (numbalib.py, similarity.py's sentences_similarity_numba twin,
# performance/kernel_tuning/, stats/normality.py) with NUMBA_DISABLE_JIT=1 so those kernel
# bodies run as plain interpreted Python and coverage.py can actually see them. Mirrors
# mlframe's numba-coverage.yml, ported 2026-07-09.

on:
  schedule:
    - cron: "0 4 * * *"
  # Auto-fires on every completed run of the main CI workflow on master -- kept alongside the
  # nightly cron as a fallback. Unlike mlframe's numba-coverage-nightly (5-8h, 8-way sharded, has
  # its own documented Actions-minutes-budget incident), this job is a single ~1-4min job, so
  # firing it after every CI-triggering push carries negligible minutes risk.
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  numba-disabled-coverage:
    name: pytest with NUMBA_DISABLE_JIT=1 (kernel-body coverage)
    runs-on: ubuntu-latest
    # workflow_run fires on EVERY completion of the CI workflow regardless of outcome -- only
    # chain off a genuinely green main CI run, not a red one. Also gated on
    # workflow_run.event == 'push': this repo is public and CI also triggers on pull_request, so
    # an unfiltered workflow_run would let an external fork's PR trigger this job with
    # checkout/write access to the base repo (the classic "pwn request" pattern -- zizmor's
    # dangerous-triggers audit flags bare workflow_run for exactly this). A push to master
    # already requires write access, so this leg is no more exposed than schedule/dispatch.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    timeout-minutes: 30
    env:
      NUMBA_DISABLE_JIT: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pyutilz with all runtime extras + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pandas,polars,database,system,llm,nlp,cloud,dev]"

      - name: Show installed versions
        run: |
          python -c "import numba; print('numba', numba.__version__)"
          python -c "import os; print('NUMBA_DISABLE_JIT =', os.environ.get('NUMBA_DISABLE_JIT'))"

      - name: Run numba-kernel-touching suites with NUMBA_DISABLE_JIT=1
        run: |
          pytest -p no:randomly \
            --cov=src/pyutilz \
            --cov-report=xml \
            --cov-report=term-missing \
            --timeout=120 \
            tests/test_numbalib.py \
            tests/test_similarity.py \
            tests/stats/test_normality.py \
            tests/performance/kernel_tuning/

      - name: Upload coverage XML as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-numba-disabled
          path: coverage.xml

      - name: Upload coverage to Codecov (numba-disabled flag)
        uses: fingoldo/py-ci-shared/.github/actions/upload-codecov@f50288e5a6f5b7f972efb60f948ce6184c8e9e70  # v1.3.4
        if: success()
        with:
          files: ./coverage.xml
          flags: numba-disabled
          token: ${{ secrets.CODECOV_TOKEN }}
