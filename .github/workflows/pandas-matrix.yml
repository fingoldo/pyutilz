# Pandas-version matrix for the pandas-facing tests.
#
# pyproject.toml declares `pandas>=1.5` for the pandas extra and has no upper cap, and there is no lock file to read a floor from. The legs are:
# the declared floor, the newest release of the floor's series, and the newest release overall (scripts/ci_version_matrix.py). Each leg runs the
# tests that touch pandas, once a day and whenever the dependency declarations change, so a pandas release is seen on its first day.
#
# The badge is published to the `badges` branch as a shields.io endpoint document, so badge updates stay out of master's history.

name: pandas-matrix

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [master]
    paths:
      - "pyproject.toml"
      - "scripts/ci_version_matrix.py"
      - ".github/workflows/pandas-matrix.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: choose the pandas versions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Resolve the legs
        # The declared floor (pandas>=1.5 in pyproject's pandas extra), the newest release of its series and the newest overall.
        id: plan
        run: |
          python -m pip install packaging
          python scripts/ci_version_matrix.py plan --package pandas --floor 1.5 --python 3.11 --github-output "$GITHUB_OUTPUT"

  test:
    name: pandas ${{ matrix.label }} on py${{ matrix.python-version }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pyutilz with the pandas-facing extras and the test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[pandas,polars,system,database,dev]"
          pip install -r requirements-dev.txt

      - name: Pin pandas to ${{ matrix.version }}
        # pandas 1.x was built against numpy 1.x and fails with "numpy.dtype size changed" on numpy 2, so the 1.x legs cap numpy below 2;
        # the others stay below 2.5, the newest numpy the tests were written for.
        env:
          PANDAS_VERSION: ${{ matrix.version }}
        run: |
          pip install "pandas==${PANDAS_VERSION}"
          if [[ "${PANDAS_VERSION}" == 1.* ]]; then
            pip install "numpy<2"
            # pyarrow 17+ requires NumPy 2 at import time, so the same leg caps it at the last NumPy-1 release.
            pip install "pyarrow<17"
          else
            pip install "numpy<2.5"
          fi

      - name: Show installed versions
        run: |
          python -c "import pandas; print('pandas', pandas.__version__)"
          python -c "import numpy; print('numpy', numpy.__version__)"
          python -c "import polars; print('polars', polars.__version__)"

      - name: Pandas-facing tests
        # Timing-ratio tests are left out: on a shared runner their ratios measure the neighbouring workers.
        run: |
          pytest tests/test_pandaslib.py tests/test_pandaslib_extra.py tests/test_pandaslib_extra2.py \
            tests/test_dtypes_regression.py tests/test_data_domain_extra.py \
            tests/test_data_stats_audit_20260902.py tests/test_data_stats_audit_20260903.py \
            tests/test_parallel.py tests/test_parallel_extra.py tests/test_system_extra2.py \
            --no-cov \
            -p no:randomly \
            -n auto \
            --timeout=900 \
            -v

  badge:
    name: update the pandas badge
    needs: [plan, test]
    if: ${{ always() && github.ref == 'refs/heads/master' && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Publish the badge document to the badges branch
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          RESULT: ${{ needs.test.result }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python -m pip install packaging
          python scripts/ci_version_matrix.py badge --package pandas --legs "$MATRIX" --result "$RESULT" --out "$RUNNER_TEMP/pandas.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$remote" badges > /dev/null; then
            git fetch --depth=1 "$remote" badges
            git checkout -B badges FETCH_HEAD
          else
            git checkout --orphan badges
            git rm -rf --quiet .
          fi
          cp "$RUNNER_TEMP/pandas.json" pandas.json
          git add pandas.json
          if git diff --cached --quiet; then
            echo "badge unchanged"
            exit 0
          fi
          git commit -m "pandas badge: $RESULT"
          git push "$remote" HEAD:badges
